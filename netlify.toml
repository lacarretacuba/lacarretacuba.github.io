# La Carreta en Netlify. Subir desde esta carpeta con:  netlify deploy --prod
# La clave del panel va en Netlify (Site configuration > Environment variables > CARRETA_CLAVE), no aquí.

[build]
  publish = "."

[functions]
  directory = "netlify/functions"

# Que no se pueda abrir desde el navegador nada interno
[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/hosting-php/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/node_modules/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/PRODUCT.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/DESIGN.md"
  to = "/404.html"
  status = 404
  force = true

# El panel no se guarda en caché, para que siempre se vea la versión al día
[[headers]]
  for = "/atras1836*"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow"
    X-Frame-Options = "DENY"
